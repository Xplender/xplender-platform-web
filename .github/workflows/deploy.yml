name: Deploy to Dokploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Trigger Dokploy deploy
    runs-on: ubuntu-latest
    steps:
      - name: Call Dokploy webhook
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}" \
            --fail
